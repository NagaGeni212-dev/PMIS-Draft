<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMIS - Proyek Tol IKN</title>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-red: #8B0000; --dark-blue: #002060; --light-bg: #F2F2F2; --card-gray: #E6E6E6; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--light-bg); }
        header { background-color: var(--primary-red); color: white; padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 3px solid #FFC000; }
        .sub-nav { background: white; display: flex; justify-content: space-around; padding: 10px; border-bottom: 1px solid #CCC; font-weight: bold; font-size: 12px; }
        .sub-nav div { cursor: pointer; color: #555; padding: 5px; }
        .sub-nav div.active { color: black; border-bottom: 2px solid var(--primary-red); }
        .tab-section { display: none; padding: 20px; }
        .active-tab { display: block; }
        
        /* Dashboard Layout */
        .dashboard-container { display: grid; grid-template-columns: 250px 1fr 250px; gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        /* Gallery Styles */
        .gallery-wrapper { background: white; padding: 20px; border-radius: 6px; }
        .gallery-tabs-container { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .gallery-tab { padding: 8px 15px; background: #eee; cursor: pointer; border-radius: 4px; font-size: 12px; }
        .gallery-tab.active { background: var(--primary-red); color: white; }
        .gallery-carousel-container { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .img-container { width: 100%; max-width: 700px; aspect-ratio: 16/9; background: #000; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; }
        .nav-btn { background: var(--dark-blue); color: white; border: none; padding: 15px; cursor: pointer; }
    </style>
</head>
<body>

<header><div><strong>PMIS - TOL IKN SEKSI 5B</strong></div></header>

<div class="sub-nav">
    <div class="active" onclick="switchTab('tab-home', this)">Home</div>
    <div onclick="switchTab('tab-monitoring', this)">Progress Monitoring</div>
    <div onclick="switchTab('tab-gallery', this)">Visualization</div>
    <div onclick="switchTab('tab-cctv', this)">CCTV</div>
    <div onclick="switchTab('tab-org', this)">Organization Chart</div>
    <div onclick="switchTab('tab-data', this)">Project Data</div>
</div>

<div id="tab-home" class="tab-section active-tab dashboard-container">
    <div class="card"><h3>Project Info</h3><div id="val-contract">Memuat...</div></div>
    <div class="card"><h3>Map View</h3><div id="map" style="height: 250px;"></div></div>
    <div class="card"><h3>Financial</h3><div id="val-hb">Memuat...</div></div>
</div>

<div id="tab-monitoring" class="tab-section"><div class="card"><h3>Progress Monitoring</h3><p>Data akan tampil di sini.</p></div></div>

<div id="tab-gallery" class="tab-section">
    <div class="gallery-wrapper">
        <div id="gallery-tabs" class="gallery-tabs-container"></div>
        <div id="gallery-carousel" class="gallery-carousel-container">
            <button class="nav-btn" onclick="prevPhoto()">❮</button>
            <div class="img-container"><img id="carousel-image" src=""></div>
            <button class="nav-btn" onclick="nextPhoto()">❯</button>
        </div>
    </div>
</div>

<div id="tab-cctv" class="tab-section"><div class="card"><h3>CCTV</h3><p>Stream offline.</p></div></div>
<div id="tab-org" class="tab-section"><div class="card"><h3>Org Chart</h3><p>PM: Daryanto Aloysius</p></div></div>
<div id="tab-data" class="tab-section"><div class="card"><h3>Project Data</h3><p>Data Kontrak.</p></div></div>

<script>
    function switchTab(id, el) {
        document.querySelectorAll('.tab-section').forEach(t => t.classList.remove('active-tab'));
        document.querySelectorAll('.sub-nav div').forEach(d => d.classList.remove('active'));
        document.getElementById(id).classList.add('active-tab');
        el.classList.add('active');
    }

    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0bXGaASnad47Vz7XXLRh2-XHa5IFsRPH98yNKadgpmhE0PO_CbWrFLZMbYjWZLuO61s_ZeeYPpkh5/pub?gid=0&single=true&output=csv';
    let galleryData = {}, currentMonth = '', currentIndex = 0;

    Papa.parse(CSV_URL, { download: true, header: true, complete: (res) => {
        res.data.forEach(row => {
            if(!row.Tanggal) return;
            const m = new Date(row.Tanggal).toLocaleString('id-ID', { month: 'long', year: 'numeric' });
            if (!galleryData[m]) galleryData[m] = [];
            galleryData[m].push(row.LinkFoto.replace('/view', '').replace('/file/d/', '/uc?export=view&id='));
        });
        Object.keys(galleryData).forEach(m => {
            let div = document.createElement('div');
            div.className = 'gallery-tab'; div.innerText = m;
            div.onclick = () => { 
                document.querySelectorAll('.gallery-tab').forEach(t => t.classList.remove('active'));
                div.classList.add('active');
                currentMonth = m; currentIndex = 0; updateCarousel(); 
            };
            document.getElementById('gallery-tabs').appendChild(div);
        });
        currentMonth = Object.keys(galleryData)[0]; updateCarousel();
    }});

    function updateCarousel() {
        document.getElementById('carousel-image').src = galleryData[currentMonth][currentIndex];
    }
    function nextPhoto() { if(currentIndex < galleryData[currentMonth].length - 1) { currentIndex++; updateCarousel(); } }
    function prevPhoto() { if(currentIndex > 0) { currentIndex--; updateCarousel(); } }
</script>
</body>
</html>
