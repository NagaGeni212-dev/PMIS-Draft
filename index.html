<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMIS - Proyek Tol IKN (Dynamic Data)</title>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --primary-red: #8B0000;
            --dark-blue: #002060;
            --light-bg: #F2F2F2;
            --card-gray: #E6E6E6;
        }

        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light-bg); overflow-x: hidden; }

        header { background-color: var(--primary-red); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #FFC000; }
        .logo-placeholder { font-weight: bold; font-size: 24px; border: 2px solid white; padding: 2px 10px; }
        
        .dashboard-container { display: grid; grid-template-columns: 240px 1fr 260px; gap: 12px; padding: 12px; }
        .card { background: white; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 10px; margin-bottom: 12px; }
        .card-header { background: var(--primary-red); color: white; text-align: center; font-size: 11px; font-weight: bold; padding: 6px; margin: -10px -10px 10px -10px; border-radius: 4px 4px 0 0; }
        
        .grid-value { background: var(--card-gray); font-weight: bold; padding: 5px; border-radius: 3px; font-size: 11px; text-align: center; }
        .red-text { color: red; }
        
        #map { height: 400px; width: 100%; border-radius: 4px; }
        
        @media (max-width: 1024px) { .dashboard-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div><strong>PMIS</strong> | PROYEK TOL IKN</div>
    </header>

    <div class="dashboard-container">
        <div class="column">
            <div class="card">
                <div class="card-header">Project Information</div>
                <div>Contract Value: <div id="contract-value" class="grid-value">Loading...</div></div>
            </div>
        </div>

        <div class="column">
            <div id="map"></div>
        </div>

        <div class="column">
            <div class="card">
                <div class="card-header">Overview Finansial</div>
                <div>Real Progress: <div id="real-progress" class="grid-value red-text">Loading...</div></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <script>
        // GANTI URL INI DENGAN URL CSV PUBLIK GOOGLE SHEET ANDA
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREOK2Wi_FWuc8XGV2cX_J94ez_cjFH6oeI40pqasgpN20PP-wlWwtbmn6DQmXk1AVdjmW1VeKVCOvc/pub?output=csv';

        async function updateData() {
            try {
                const response = await fetch(sheetUrl);
                const csvText = await response.text();

                Papa.parse(csvText, {
                    header: true,
                    complete: function(results) {
                        const row = results.data[0]; // Mengambil baris pertama
                        
                        // Update elemen HTML berdasarkan nama kolom di Google Sheet
                        if(row.ContractValue) document.getElementById('contract-value').innerText = row.ContractValue;
                        if(row.RealProgress) document.getElementById('real-progress').innerText = row.RealProgress;
                        
                        console.log("Data diperbarui dari Sheet:", row);
                    }
                });
            } catch (err) {
                console.error("Gagal mengambil data:", err);
            }
        }

        // Inisialisasi Peta
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
            center: [116.6856, -1.1274],
            zoom: 13
        });

        // Jalankan saat load
        window.onload = updateData;
    </script>
</body>
</html>
